# Disposable local development stack. Do not use the test OIDC issuer or root users in production.
services:
  syncthing:
    image: syncthing/syncthing:latest
    environment:
      PUID: "0"
      PGID: "0"
      STGUIADDRESS: 127.0.0.1:8384
      STGUIAPIKEY: ${STGUIAPIKEY:-test-only-syncthing-api-key}
    volumes:
      - syncthing-config:/var/syncthing
      - user-data:/data
    ports:
      - 127.0.0.1:48080:8080
      - 127.0.0.1:48555:48555
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped

  oidc-fixture:
    build:
      context: .
      target: oidc-fixture
    environment:
      OIDC_FIXTURE_LISTEN: ":48555"
    network_mode: service:syncthing
    depends_on:
      - syncthing
    restart: unless-stopped

  storage-init:
    image: alpine:3.22
    command: ["mkdir", "-p", "/data/users"]
    volumes:
      - user-data:/data

  wrapper:
    build: .
    user: "0:0"
    environment:
      APP_CONFIG: /opt/local/config.json
      APP_OIDC_CLIENT_SECRET: test-only-secret
      APP_SYNCTHING_API_KEY: ${STGUIAPIKEY:-test-only-syncthing-api-key}
    volumes:
      - user-data:/data
    network_mode: service:syncthing
    depends_on:
      syncthing:
        condition: service_started
      oidc-fixture:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  syncthing-config:
  user-data:
